[project]
name = "wehoop-wbb-data-build"
version = "0.1.0"
description = "Python producer for the ESPN WBB release datasets (parity port of the R creation scripts)."
requires-python = ">=3.11"
dependencies = [
    "sportsdataverse>=0.0.71",
    "polars>=1.0,<2.0",
    "pyarrow>=15.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8.0"]

# Dev-period source: the sdv-py feature worktree carrying the new helper_wbb_*
# producers. Flip to the sibling root (../../../sdv-py) or the released pin once
# sdv-py feat/wbb-python-producer merges (tracked in the SDD ledger).
[tool.uv.sources]
sportsdataverse = { path = "../../../sdv-py/.claude/worktrees/wbb-python-producer", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
