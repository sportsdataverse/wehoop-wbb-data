name: Update WBB Data

# Serialize every workflow in this repo that commits to it. Two runs in flight
# put one of them behind origin and its push is rejected -- and because the git
# calls are wrapped in `>/dev/null` with no rc check, that lands as a GREEN job
# that published nothing. wehoop-wnba-data runs 32192069433 + 32192069566
# (2026-08-18) are the worked example.
#
# The group is REPO-wide, not per-workflow: the daily, weekly and annual jobs all
# commit to the same branch, so a per-workflow group would still let the daily
# race the weekly.
#
# cancel-in-progress is FALSE on purpose -- these runs also upload release
# assets, and cancelling mid-upload leaves a tag half-updated. Queue instead.
concurrency:
  group: ${{ github.repository }}-commit
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 7 18-31 10 *'   # late October (season opens)
    - cron: '0 7 * 11-12 *'    # November - December
    - cron: '0 7 * 1-3 *'      # January - March (regular season + conf tourneys)
    - cron: '0 7 1-12 4 *'     # early April (NCAA tournament tail)
  repository_dispatch:
    types: [daily_wbb_data]
  workflow_dispatch:
    inputs:
      start_year:
        required: false
        type: string
      end_year:
        required: false
        type: string
      use_python_build:
        required: false
        description: "Use the python wbb_data_build processor (default). Set false to roll back to the R processor."
        type: boolean
        default: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update_wbb_data:
    # Python (wbb_data_build) owns the 12 raw-derived datasets; R is retained
    # for the crosswalks (wbb_13-15).
    # ubuntu matches daily_cfb (the previous windows matrix predates the cutover).
    runs-on: ubuntu-latest
    name: Update WBB Data ${{ inputs.start_year }}-${{ inputs.end_year }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      START_YEAR: ${{ inputs.start_year }}
      END_YEAR: ${{ inputs.end_year }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setting up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Setting up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          extra-packages: |
            sportsdataverse/wehoop
            sportsdataverse/sportsdataverse-data
            ropensci/piggyback

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install Python deps
        working-directory: python
        run: uv sync

      - name: Extract years from trigger dispatch
        if: ${{ github.event.client_payload.event_name == 'daily_wbb_data' }}
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.client_payload.commit_message }}
        run: |
          # `Start:\s*\K[0-9]{4}` anchors to the canonical token in the
          # upstream `WBB Raw Update (Start: YYYY End: YYYY)` commit
          # message so embedded numbers (PR ids, run ids, error codes)
          # don't shadow the year extraction.
          # `|| true` is load-bearing. Actions runs `shell: bash` as
          # `bash -eo pipefail`, so a grep that matches nothing exits 1,
          # pipefail propagates it, and THIS STEP DIES -- which means the
          # "Default year inputs if empty" step below can never run. Any
          # dispatch whose commit message is not the canonical
          # `WBB Raw Update (Start: YYYY End: YYYY)` (a human merge to main,
          # say) therefore failed the whole run instead of falling back.
          start=$(printf '%s' "$COMMIT_MESSAGE" | grep -oP 'Start:\s*\K[0-9]{4}' | head -1 || true)
          end=$(printf '%s' "$COMMIT_MESSAGE"   | grep -oP 'End:\s*\K[0-9]{4}'   | head -1 || true)
          echo "START_YEAR=$start" >> $GITHUB_ENV
          echo "END_YEAR=$end"     >> $GITHUB_ENV

      - name: Default year inputs if empty
        if: ${{ env.START_YEAR == '' }}
        shell: bash
        run: |
          echo "START_YEAR=$(Rscript -e 'cat(wehoop::most_recent_wbb_season())')" >> $GITHUB_ENV
          echo "END_YEAR=$(Rscript -e 'cat(wehoop::most_recent_wbb_season())')" >> $GITHUB_ENV

      - name: Update WBB Data ${{ env.START_YEAR }}-${{ env.END_YEAR }}
        shell: bash
        env:
          GITHUB_PAT: ${{ secrets.SDV_GH_TOKEN }}   # R piggyback/sportsdataversedata + contents API
          GH_TOKEN: ${{ secrets.SDV_GH_TOKEN }}      # gh CLI publish (wbb_data_build)
          SPORTSDATAVERSE.UPLOAD.QUIET: FALSE
          SPORTSDATAVERSE.UPLOAD.MAX_TIMES: 20
        run: |
          # Python is the production default (unchanged). use_python_build=false
          # selects the R path within the SAME processor -- there is no longer a
          # separate daily_wbb_R_processor.sh, so the two paths cannot drift in
          # season handling, logging, or the load-bearing commit format.
          # Cron / repository_dispatch pass no inputs, so they take the python path.
          if [ "${{ inputs.use_python_build }}" = "false" ]; then
            bash scripts/daily_wbb_data_processor.sh -s ${{ env.START_YEAR }} -e ${{ env.END_YEAR }} -l R
          else
            bash scripts/daily_wbb_data_processor.sh -s ${{ env.START_YEAR }} -e ${{ env.END_YEAR }} -l python
          fi
